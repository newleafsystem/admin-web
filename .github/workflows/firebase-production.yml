name: Firebase Production

on:
  push:
    branches:
      - main
    paths:
      - '.firebaserc'
      - 'apps/admin/**'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-firebase-hosting.js'
  workflow_dispatch:

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  build-and-deploy-hosting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'newleaf-trading' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build admin UI
        run: npm run firebase:build
        env:
          REQUIRE_AUTH: ${{ vars.REQUIRE_AUTH || 'true' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Validate Firebase auth config
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEWLEAF_TRADING }}
        run: |
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "FIREBASE_SERVICE_ACCOUNT_NEWLEAF_TRADING repository secret is required for Firebase Hosting deploy." >&2
            exit 1
          fi

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEWLEAF_TRADING }}
          channelId: live
          projectId: ${{ env.GCP_PROJECT_ID }}
