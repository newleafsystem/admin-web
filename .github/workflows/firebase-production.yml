name: Firebase Production

on:
  push:
    branches:
      - main

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  build-and-deploy-hosting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build admin UI
        run: npm run firebase:build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEWLEAF_TRADING }}
          projectId: newleaf-trading
          channelId: live
