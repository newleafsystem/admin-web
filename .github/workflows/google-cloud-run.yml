name: Google Cloud Run Services

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'docs/service-api-openapi.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/video-assembler/**'
      - 'scripts/setup-google-cloud-run-api.sh'
      - 'scripts/setup-google-cloud-run-renderer.sh'
      - 'services/api/**'
      - 'services/media-renderer/**'
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Deploy the API Cloud Run service
        required: false
        default: true
        type: boolean
      deploy_renderer:
        description: Deploy the FFmpeg renderer Cloud Run service
        required: false
        default: true
        type: boolean

concurrency:
  group: google-cloud-run-services
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'newleaf-trading' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GOOGLE_CLOUD_RUN_API_SERVICE: ${{ vars.GOOGLE_CLOUD_RUN_API_SERVICE || 'newleaf-api' }}
      GOOGLE_CLOUD_RUN_RENDERER_SERVICE: ${{ vars.GOOGLE_CLOUD_RUN_RENDERER_SERVICE || 'newleaf-ffmpeg-renderer' }}
      SKIP_ENABLE_APIS: ${{ vars.SKIP_ENABLE_APIS || 'true' }}
      SKIP_PROVISIONING: ${{ vars.SKIP_PROVISIONING || 'true' }}
      CLOUD_BUILD_SUPPRESS_LOGS: ${{ vars.CLOUD_BUILD_SUPPRESS_LOGS || 'true' }}
      REQUIRE_AUTH: ${{ vars.REQUIRE_AUTH || 'true' }}
      AUTH_ADMIN_EMAILS: ${{ vars.AUTH_ADMIN_EMAILS }}
      AUTH_SESSION_COOKIE_NAME: ${{ vars.AUTH_SESSION_COOKIE_NAME || 'newleaf_session' }}
      AUTH_SESSION_COOKIE_DOMAIN: ${{ vars.AUTH_SESSION_COOKIE_DOMAIN || '.newleafsystem.com' }}
      AUTH_SESSION_COOKIE_PATH: ${{ vars.AUTH_SESSION_COOKIE_PATH || '/' }}
      AUTH_SESSION_COOKIE_MAX_AGE_SEC: ${{ vars.AUTH_SESSION_COOKIE_MAX_AGE_SEC || '432000' }}
      AUTH_SESSION_COOKIE_SAME_SITE: ${{ vars.AUTH_SESSION_COOKIE_SAME_SITE || 'lax' }}
      AUTH_SESSION_COOKIE_SECURE: ${{ vars.AUTH_SESSION_COOKIE_SECURE || 'true' }}
      FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID || 'newleafdb' }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://api.newleafsystem.com' }}
      ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL || 'https://admin.newleafsystem.com' }}
      SOCIAL_CALLBACK_BASE_URL: ${{ vars.SOCIAL_CALLBACK_BASE_URL || 'https://api.newleafsystem.com' }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || 'https://admin.newleafsystem.com https://newleafsystem.com https://www.newleafsystem.com https://preview.newleafsystem.com' }}
      MEDIA_RENDERER_URL: ${{ vars.MEDIA_RENDERER_URL }}
      MEDIA_RENDER_HMAC_SECRET: ${{ secrets.MEDIA_RENDER_HMAC_SECRET }}
      YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REDIRECT_URI: ${{ vars.YOUTUBE_REDIRECT_URI || 'https://api.newleafsystem.com/api/v1/social/youtube/oauth/callback' }}
      YOUTUBE_SCOPES: ${{ vars.YOUTUBE_SCOPES || 'https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/youtube.force-ssl' }}
      YOUTUBE_DEFAULT_PRIVACY_STATUS: ${{ vars.YOUTUBE_DEFAULT_PRIVACY_STATUS || 'private' }}
      YOUTUBE_DEFAULT_CATEGORY_ID: ${{ vars.YOUTUBE_DEFAULT_CATEGORY_ID || '27' }}
      X_CLIENT_ID: ${{ vars.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_REDIRECT_URI: ${{ vars.X_REDIRECT_URI || 'https://api.newleafsystem.com/api/v1/social/x/oauth/callback' }}
      X_SCOPES: ${{ vars.X_SCOPES || 'tweet.read users.read tweet.write media.write offline.access' }}
      X_UPLOAD_CHUNK_BYTES: ${{ vars.X_UPLOAD_CHUNK_BYTES || '4194304' }}
      LINKEDIN_CLIENT_ID: ${{ vars.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_REDIRECT_URI: ${{ vars.LINKEDIN_REDIRECT_URI || 'https://api.newleafsystem.com/api/v1/social/linkedin/oauth/callback' }}
      LINKEDIN_SCOPES: ${{ vars.LINKEDIN_SCOPES || 'openid profile email w_member_social r_organization_social' }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202604' }}
      META_APP_ID: ${{ vars.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_REDIRECT_URI: ${{ vars.META_REDIRECT_URI || 'https://api.newleafsystem.com/api/v1/social/meta/oauth/callback' }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v21.0' }}
      META_FACEBOOK_SCOPES: ${{ vars.META_FACEBOOK_SCOPES || 'pages_show_list pages_manage_posts pages_read_engagement' }}
      META_INSTAGRAM_SCOPES: ${{ vars.META_INSTAGRAM_SCOPES || 'pages_show_list pages_read_engagement instagram_basic instagram_content_publish' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test
        env:
          REQUIRE_AUTH: 'false'

      - name: Detect Cloud Run changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "api=${{ inputs.deploy_api }}" >> "$GITHUB_OUTPUT"
            echo "renderer=${{ inputs.deploy_renderer }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api=false
          renderer=false
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-list --max-parents=0 HEAD)"
          fi

          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            {
              echo "Previous commit $before is not available in this checkout."
              echo "Deploying the API as a safe fallback."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "renderer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"

          if echo "$changed_files" | grep -Eq '^(apps/api/|docs/service-api-openapi\.yaml|package\.json|package-lock\.json|packages/video-assembler/|scripts/setup-google-cloud-run-api\.sh|services/api/)'; then
            api=true
          fi

          if echo "$changed_files" | grep -Eq '^(package\.json|package-lock\.json|scripts/setup-google-cloud-run-renderer\.sh|services/media-renderer/)'; then
            renderer=true
          fi

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "renderer=$renderer" >> "$GITHUB_OUTPUT"
          {
            echo "Changed files:"
            echo "$changed_files"
            echo "API deploy: $api"
            echo "Renderer deploy: $renderer"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Google auth config
        if: ${{ steps.changes.outputs.api == 'true' || steps.changes.outputs.renderer == 'true' }}
        shell: bash
        run: |
          if [[ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ]]; then
            echo "GCP_WORKLOAD_IDENTITY_PROVIDER repository secret is required." >&2
            exit 1
          fi
          if [[ ! "${GCP_SERVICE_ACCOUNT:-}" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "GCP_SERVICE_ACCOUNT must be a service-account email like name@project.iam.gserviceaccount.com." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: ${{ steps.changes.outputs.api == 'true' || steps.changes.outputs.renderer == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        if: ${{ steps.changes.outputs.api == 'true' || steps.changes.outputs.renderer == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Google credentials file
        if: ${{ steps.changes.outputs.api == 'true' || steps.changes.outputs.renderer == 'true' }}
        shell: bash
        run: |
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" || ! -f "${GOOGLE_APPLICATION_CREDENTIALS}" ]]; then
            echo "Google credentials file was not created by google-github-actions/auth." >&2
            exit 1
          fi

      - name: Deploy renderer
        id: deploy_renderer
        if: ${{ steps.changes.outputs.renderer == 'true' }}
        run: bash scripts/setup-google-cloud-run-renderer.sh

      - name: Resolve renderer URL
        if: ${{ steps.changes.outputs.api == 'true' }}
        shell: bash
        run: |
          if [[ -n "${{ steps.deploy_renderer.outputs.service_url }}" ]]; then
            echo "MEDIA_RENDERER_URL=${{ steps.deploy_renderer.outputs.service_url }}" >> "${GITHUB_ENV}"
            exit 0
          fi

          if [[ -n "${MEDIA_RENDERER_URL:-}" ]]; then
            exit 0
          fi

          if renderer_url="$(gcloud run services describe "${GOOGLE_CLOUD_RUN_RENDERER_SERVICE}" --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" --format='value(status.url)' 2>/dev/null)" && [[ -n "${renderer_url}" ]]; then
            echo "MEDIA_RENDERER_URL=${renderer_url}" >> "${GITHUB_ENV}"
          else
            echo "Renderer service URL could not be resolved; API deploy will continue without MEDIA_RENDERER_URL."
          fi

      - name: Deploy API
        if: ${{ steps.changes.outputs.api == 'true' }}
        run: bash scripts/setup-google-cloud-run-api.sh
